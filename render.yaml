services:
  - type: web
    name: homework-helper-parent
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start -- --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: OPENROUTER_MODEL
        value: openai/gpt-5.2
      - key: OPENROUTER_API_KEY
        sync: false
